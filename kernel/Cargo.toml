[package]
name = "ouroboros-kernel"
version = "0.22.0"
edition = "2021"

[dependencies]
fdt = "0.1.5"
log = "0.4.33"
syscall-abi = { path = "../syscall-abi" }
# The key-sequence filter userland's readers use: the kernel uses it to keep
# a key whole in the keyboard queue and across a change of owner.
keyseq = { path = "../keyseq" }
uefi = { version = "0.39", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
# The version `uefi` 0.39 itself depends on (one crate in the lock file, not
# two): for the raw `EFI_LOADED_IMAGE_PROTOCOL` layout earlyfault.rs reads
# out of the firmware's debug image info table, which `uefi` does not expose.
uefi-raw = "0.15"

[[bin]]
name = "BOOTAA64"
path = "src/main.rs"
