[package]
name = "shell"
version = "0.1.0"
edition = "2021"

[dependencies]
syscall-abi = { path = "../../syscall-abi" }
ninep-abi = { path = "../../ninep-abi" }
accounts = { path = "../../accounts" }
# The realm and the user-key derivation `login` runs (docs/roadmap/roadmap-user-keys.md, step 4).
clusterkeys = { path = "../../clusterkeys" }
# The one filter every keyboard reader uses for escape sequences.
keyseq = { path = "../../keyseq" }

[[bin]]
name = "shell"
path = "src/main.rs"
