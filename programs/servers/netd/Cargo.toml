[package]
name = "netd"
version = "0.1.0"
edition = "2021"

[dependencies]
syscall-abi = { path = "../../../syscall-abi" }
ninep-abi = { path = "../../../ninep-abi" }
# Account-file field parsing, shared with `login` and the /bin account tools, so
# the cluster resolves a name by exactly the rules a local session uses.
accounts = { path = "../../../accounts" }
# Per-machine cluster keys: the signature primitive and the authorized-peer
# file format (docs/roadmap-cluster-keys.md step 7).
ed25519 = { path = "../../../ed25519" }
clusterkeys = { path = "../../../clusterkeys" }
# The held user keys' table and rules, host-tested; netd supplies liveness.
heldkeys = { path = "../../../heldkeys" }

# test-server-children's build alone (`make test-server-children`): a ping of
# one address makes netd fault and of another makes it spin, so a rig can
# have the supervisor restart netd at a moment it chooses, which no request
# to the shipped netd does. Built into target/restart-rig, apart from the
# shipped netd.bin, and it says so at startup.
[features]
restart-rig = []

[[bin]]
name = "netd"
path = "src/main.rs"
