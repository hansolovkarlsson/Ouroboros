[package]
name = "fsd"
version = "0.1.0"
edition = "2021"

[dependencies]
syscall-abi = { path = "../../../syscall-abi" }
ninep-abi = { path = "../../../ninep-abi" }
parttable = { path = "../../../parttable" }

# A build for `make test-disk-gate` alone (scripts/test-long-set.py
# --disk-gate), never staged on an image anything else boots: the verb gate
# does not ask an arm's `read_only()` (`vfs::Mount::refuses_changes`), so a
# write to a read-only exFAT volume reaches exFAT's own disk gate, which no
# boot of the shipped fsd can. Built into target/disk-gate, apart from the
# shipped fsd.bin, and it says so at startup.
[features]
disk-gate-rig = []
# test-fsd-restart's build alone (`make test-fsd-restart`): any request
# with a path that ends in `restart-rig-fault` makes fsd fault and
# `restart-rig-spin` makes it spin, so a rig can have the supervisor restart fsd at a moment it
# chooses, which no request to the shipped fsd does. Built into
# target/fsd-restart-rig, apart from the shipped fsd.bin, and it says so at
# startup. netd's `restart-rig` is the same for netd.
restart-rig = []

[[bin]]
name = "fsd"
path = "src/main.rs"
