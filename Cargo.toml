[workspace]
resolver = "2"
members = [
    # Kernel + shared libraries stay at the repo root.
    "kernel", "ulib", "syscall-abi", "ninep-abi",
    # All userland programs live under programs/, grouped by role.
    "programs/shell",
    "programs/servers/fsd", "programs/servers/cond", "programs/servers/netd",
    "programs/demos/hello", "programs/demos/pong",
    "programs/fileutils/ls", "programs/fileutils/cat", "programs/fileutils/mkdir",
    "programs/fileutils/rmdir", "programs/fileutils/touch", "programs/fileutils/rm",
    "programs/fileutils/cp", "programs/fileutils/mv", "programs/fileutils/writeat",
    "programs/fileutils/tree", "programs/fileutils/write", "programs/fileutils/more",
    "programs/fileutils/chmod", "programs/fileutils/chown",
    "programs/textutils/upper", "programs/textutils/wc", "programs/textutils/grep",
    "programs/textutils/head", "programs/textutils/tail", "programs/textutils/nl",
    "programs/textutils/rev", "programs/textutils/uniq", "programs/textutils/sort",
    "programs/netutils/ping", "programs/netutils/resolve", "programs/netutils/fetch",
    "programs/netutils/dial", "programs/netutils/serve",
    "programs/shellutils/echo", "programs/shellutils/uptime", "programs/shellutils/clear",
    "programs/shellutils/args", "programs/shellutils/pwd", "programs/shellutils/readkey",
    "programs/shellutils/send", "programs/shellutils/recv", "programs/shellutils/selftest",
    "programs/shellutils/man", "programs/shellutils/printenv", "programs/shellutils/id",
]
# `shell`, `hello`, and `pong` are built explicitly with `--target
# aarch64-unknown-none` (see the Makefile) - they must never be pulled
# into a plain `cargo build`/`clippy` at the repo root, which would try
# to build them for the workspace-wide default target
# (aarch64-unknown-uefi, from .cargo/config.toml) and fail to link,
# since they aren't UEFI applications. `syscall-abi` has no such conflict (a
# plain `#![no_std]` lib, no [[bin]] to link) and doesn't need adding to
# default-members separately - `kernel` pulls it in as a path dependency,
# so a bare `cargo build` already builds it too.
default-members = ["kernel"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
