[workspace]
resolver = "2"
members = ["kernel", "shell", "syscall-abi"]
# `shell` is built explicitly with `--target aarch64-unknown-none` (see the
# Makefile) - it must never be pulled into a plain `cargo build`/`clippy` at
# the repo root, which would try to build it for the workspace-wide default
# target (aarch64-unknown-uefi, from .cargo/config.toml) and fail to link,
# since it isn't a UEFI application. `syscall-abi` has no such conflict (a
# plain `#![no_std]` lib, no [[bin]] to link) and doesn't need adding to
# default-members separately - `kernel` pulls it in as a path dependency,
# so a bare `cargo build` already builds it too.
default-members = ["kernel"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
