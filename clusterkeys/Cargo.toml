[package]
name = "clusterkeys"
version = "0.1.0"
edition = "2021"

# Pure, no_std, no I/O, no syscalls, no heap: the on-disk format for per-machine
# cluster identity (docs/roadmap-cluster-keys.md step 6). Callers do their own
# file reading and pass byte buffers in, exactly like `accounts`.
#
# Host-testable: cargo test -p clusterkeys --target aarch64-apple-darwin, or
# `make test`.
[lib]
path = "src/lib.rs"

[dependencies]
# PBKDF2 and Ed25519 for the user key (docs/roadmap/roadmap-user-keys.md,
# step 3); the domain tag, the iteration count and the realm limit are
# cross-node constants and live in ninep-abi.
ed25519 = { path = "../ed25519" }
ninep-abi = { path = "../ninep-abi" }
